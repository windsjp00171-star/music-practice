<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習進度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<script>
/* tokens.css 載入失敗時的 inline fallback。值要與 shared/tokens.css 一致。 */
(function(){
  if(getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()) return;
  var s=document.createElement("style");
  s.textContent=":root{--ink:#121A18;--ink-2:#1A2523;--ink-3:#243230;--line:#2E3E3A;"+
    "--paper:#F2EFE6;--dim:#7E8C87;--amber:#E9A63C;--good:#5FBF8F;--bad:#D8695E;--radius:10px}"+
    ".mp-back{display:inline-block;margin:14px 0 0;font-size:12px;color:#7E8C87;text-decoration:none}";
  document.head.appendChild(s);
})();
</script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--ink); color:var(--paper);
    font-family:"Noto Sans TC", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:48px;
  }
  .wrap{ max-width:620px; margin:0 auto; padding:0 16px; }

  header{ padding:20px 0 14px; border-bottom:1px solid var(--line); }
  .htop{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h1{ font-size:15px; font-weight:700; letter-spacing:.08em; }
  .count{ font-family:"Archivo",sans-serif; font-weight:800; font-size:14px;
          color:var(--amber); font-variant-numeric:tabular-nums; }
  header p{ font-size:12px; color:var(--dim); margin-top:6px; line-height:1.65; }
  .bar{ height:3px; background:var(--ink-3); border-radius:2px; margin-top:12px; overflow:hidden; }
  .bar span{ display:block; height:100%; background:var(--amber); width:0;
             transition:width .3s ease; }

  .seg{ display:flex; border:1px solid var(--line); border-radius:9px;
        overflow:hidden; margin:16px 0 20px; }
  .seg > button{
    flex:1; background:transparent; color:var(--dim); border:none;
    border-right:1px solid var(--line); padding:11px 8px; cursor:pointer;
    font-family:inherit; font-size:13.5px;
  }
  .seg > button:last-child{ border-right:none; }
  .seg > button[aria-pressed="true"]{ background:var(--paper); color:var(--ink); font-weight:700; }
  .seg > button:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }

  .stage{
    background:var(--ink-2); border:1px solid var(--line);
    border-radius:12px; padding:16px; margin-bottom:11px;
  }
  .stage.on{ border-color:var(--amber); }
  .stage.cleared{ opacity:.5; }
  .stop{ display:flex; align-items:baseline; gap:10px; }
  .no{ font-family:"Archivo",sans-serif; font-weight:800; font-size:12px;
       letter-spacing:.1em; color:var(--amber); flex:0 0 auto; }
  h2{ font-size:15px; font-weight:700; }
  .cond{ font-size:13px; color:#C8CFCB; line-height:1.8; margin-top:8px; }
  .cond b{ color:var(--paper); font-weight:500; }
  .condlabel{ font-size:10.5px; color:var(--dim); letter-spacing:.14em; margin-top:12px; }

  .states{ display:flex; gap:6px; margin-top:13px; flex-wrap:wrap; }
  .st{
    background:transparent; color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; font-family:inherit; font-size:12.5px;
    cursor:pointer;
  }
  .st[aria-pressed="true"]{ background:var(--paper); color:var(--ink);
                            border-color:var(--paper); font-weight:700; }
  .st:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

  .stamp{ font-size:11.5px; color:var(--amber); margin-top:10px;
          font-variant-numeric:tabular-nums; }

  textarea{
    width:100%; margin-top:11px; min-height:52px; resize:vertical;
    background:var(--ink-3); color:var(--paper);
    border:1px solid var(--line); border-radius:8px; padding:10px 11px;
    font-family:inherit; font-size:13px; line-height:1.6;
  }
  textarea::placeholder{ color:#5C6A66; }
  textarea:focus{ outline:2px solid var(--amber); outline-offset:1px; }

  .foot{ display:flex; justify-content:space-between; align-items:center;
         gap:12px; margin-top:20px; }
  .ghost{
    background:transparent; color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; font-family:inherit; font-size:12.5px;
    cursor:pointer;
  }
  .ghost:hover{ color:var(--paper); border-color:var(--dim); }
  .status{ font-size:11.5px; color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">

  <a class="mp-back" href="index.html">← 全部模組</a>

  <header>
    <div class="htop">
      <h1>練習進度</h1>
      <span class="count" id="count">—</span>
    </div>
    <p>用「關」不用「週」。通過就前進，花幾天無關。沒有連續天數、沒有排行。</p>
    <div class="bar"><span id="bar"></span></div>
  </header>

  <div class="seg" id="inst">
    <button type="button" data-v="guitar" aria-pressed="true">木吉他</button>
    <button type="button" data-v="piano"  aria-pressed="false">鋼琴</button>
  </div>

  <div id="board"></div>

  <div class="foot">
    <span class="status" id="save">載入中…</span>
    <button class="ghost" id="reset" type="button">全部重設</button>
  </div>

</div>

<script src="shared/store.js"></script>
<script src="shared/stages.js"></script>
<script>
(function(){
  "use strict";
  if(!window.MP||!MP.store||!MP.stages){ document.body.innerHTML='<p style="max-width:620px;margin:48px auto;padding:0 16px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.9;color:#F2EFE6">共用檔案載入失敗（需要 shared/store.js 與 shared/stages.js）。請確認這個 HTML 與 shared/ 資料夾放在同一層。</p>'; return; }

  var KEY=MP.store.KEYS.progress;

  /* 八關的內容在 shared/stages.js。要改關卡就改那裡。 */
  var STAGES=MP.stages;

  var STATES=[
    { v:"idle",    label:"未開始" },
    { v:"working", label:"練習中" },
    { v:"cleared", label:"過關" }
  ];

  var data=null, inst="guitar", timer=null;
  var $=function(id){ return document.getElementById(id); };

  function blank(){
    var s={};
    ["guitar","piano"].forEach(function(k){
      s[k]=STAGES[k].map(function(){ return { st:"idle", note:"", on:null }; });
    });
    return s;
  }

  var today=MP.store.today;

  function save(){
    clearTimeout(timer);
    timer=setTimeout(function(){
      if(!MP.store.available()){ $("save").textContent="此環境無法儲存，離開後會清空"; return; }
      MP.store.set(KEY, data)
        .then(function(){ $("save").textContent="已儲存"; })
        .catch(function(){ $("save").textContent="儲存失敗，剛才的變更沒存到"; });
    },400);
  }

  function load(){
    if(!MP.store.available()){
      data=blank(); $("save").textContent="此環境無法儲存，離開後會清空"; render(); return;
    }
    MP.store.get(KEY).then(function(v){
      data=v || blank();
      $("save").textContent="已儲存"; render();
    }).catch(function(){
      data=blank(); $("save").textContent="尚未有紀錄"; render();
    });
  }

  function render(){
    var list=STAGES[inst], d=data[inst], board=$("board");
    board.innerHTML="";

    list.forEach(function(s,i){
      var rec=d[i];
      var card=document.createElement("div");
      card.className="stage"+(rec.st==="working"?" on":"")+(rec.st==="cleared"?" cleared":"");

      var top=document.createElement("div");
      top.className="stop";
      top.innerHTML='<span class="no">'+String(i+1).padStart(2,"0")+'</span><h2>'+s.h+'</h2>';
      card.appendChild(top);

      var cl=document.createElement("div");
      cl.className="condlabel"; cl.textContent="通過條件";
      card.appendChild(cl);

      var c=document.createElement("p");
      c.className="cond"; c.innerHTML=s.c;
      card.appendChild(c);

      var row=document.createElement("div");
      row.className="states";
      STATES.forEach(function(st){
        var b=document.createElement("button");
        b.type="button"; b.className="st"; b.textContent=st.label;
        b.setAttribute("aria-pressed", rec.st===st.v ? "true":"false");
        b.addEventListener("click",function(){
          rec.st=st.v;
          rec.on = st.v==="cleared" ? (rec.on || today()) : null;
          save(); render();
        });
        row.appendChild(b);
      });
      card.appendChild(row);

      if(rec.st==="cleared" && rec.on){
        var sp=document.createElement("div");
        sp.className="stamp"; sp.textContent="過關 "+rec.on;
        card.appendChild(sp);
      }

      var ta=document.createElement("textarea");
      ta.placeholder="卡在哪？後來怎麼解的？";
      ta.value=rec.note;
      ta.addEventListener("input",function(){ rec.note=ta.value; save(); });
      card.appendChild(ta);

      board.appendChild(card);
    });

    var done=d.filter(function(r){ return r.st==="cleared"; }).length;
    $("count").textContent=done+" / "+list.length;
    $("bar").style.width=(done/list.length*100)+"%";
  }

  $("inst").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    inst=b.dataset.v;
    Array.prototype.forEach.call(this.children,function(x){
      x.setAttribute("aria-pressed", x===b ? "true":"false");
    });
    render();
  });

  $("reset").addEventListener("click",function(){
    if(!confirm("清空全部進度與卡點紀錄？無法復原。")) return;
    data=blank(); save(); render();
  });

  load();
})();
</script>
</body>
</html>
