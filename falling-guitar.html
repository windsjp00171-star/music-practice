<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掉落練習 · 吉他</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121A18">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/tokens.css">
<script>
/* tokens.css 載入失敗時的 inline fallback。值要與 shared/tokens.css 一致。 */
(function(){
  if(getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()) return;
  var s=document.createElement("style");
  s.textContent=":root{--ink:#121A18;--ink-2:#1A2523;--ink-3:#243230;--line:#2E3E3A;"+
    "--paper:#F2EFE6;--dim:#7E8C87;--amber:#E9A63C;--good:#5FBF8F;--bad:#D8695E;--radius:10px}"+
    ".mp-back{display:inline-block;margin:14px 0 0;font-size:12px;color:#7E8C87;text-decoration:none}";
  document.head.appendChild(s);
})();
</script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--ink); color:var(--paper);
        font-family:"Noto Sans TC", system-ui, sans-serif;
        -webkit-font-smoothing:antialiased; padding-bottom:40px; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 14px; }

  header{ padding:16px 0 12px; border-bottom:1px solid var(--line);
          display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1{ font-size:15px; font-weight:700; letter-spacing:.08em; }
  .run{ background:var(--paper); color:var(--ink); border:none; border-radius:9px;
        padding:10px 22px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .run.on{ background:var(--amber); color:#241703; }
  .run:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

  .picker{ display:flex; align-items:center; gap:10px; margin:14px 0 6px; flex-wrap:wrap; }
  .picker label{ font-size:11.5px; color:var(--dim); letter-spacing:.08em; }
  select{ background:var(--ink-3); color:var(--paper); border:1px solid var(--line);
          border-radius:8px; padding:8px 11px; font-family:inherit; font-size:13.5px; cursor:pointer; }
  select:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .meta{ font-size:11.5px; color:var(--dim); line-height:1.7; margin-bottom:10px; }

  canvas{ display:block; width:100%; border:1px solid var(--line);
          border-radius:12px; background:var(--ink-2); }

  .fb{ background:var(--ink-2); border:1px solid var(--line); border-radius:12px;
       padding:14px 15px; margin-top:12px; }
  .fbrow{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .fbrow:last-of-type{ margin-bottom:0; }
  .fblab{ font-size:12px; color:var(--dim); }
  .fbval{ font-family:"Archivo",sans-serif; font-weight:800; font-size:17px;
          font-variant-numeric:tabular-nums; }
  .fbval.ok{ color:var(--good); } .fbval.off{ color:var(--amber); } .fbval.bad{ color:var(--bad); }
  .fbnote{ font-size:12px; color:var(--dim); line-height:1.7; margin-top:10px;
           padding-top:10px; border-top:1px solid var(--line); }
  .fbnote b{ color:var(--paper); font-weight:500; }

  .panel{ border-top:1px solid var(--line); margin-top:16px; padding-top:14px;
          display:flex; flex-direction:column; gap:13px; }
  .row{ display:flex; flex-wrap:wrap; align-items:center; gap:11px 20px; }
  .field{ display:flex; align-items:center; gap:9px; }
  .field > label{ font-size:11.5px; color:var(--dim); letter-spacing:.08em; }
  .step{ width:40px; height:40px; border-radius:8px; background:var(--ink-3);
         color:var(--paper); border:1px solid var(--line); cursor:pointer; font-size:16px; }
  .step:hover{ background:var(--line); }
  .bv{ font-family:"Archivo",sans-serif; font-weight:700; font-size:22px;
       min-width:56px; text-align:center; font-variant-numeric:tabular-nums; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button{ background:transparent; color:var(--dim); border:none;
               border-right:1px solid var(--line); padding:8px 12px; font-size:12.5px;
               cursor:pointer; font-family:inherit; }
  .seg button:last-child{ border-right:none; }
  .seg button[aria-pressed="true"]{ background:var(--paper); color:var(--ink); font-weight:700; }
  .seg button:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }

  .err{ background:rgba(216,105,94,.1); border-left:2px solid var(--bad);
        border-radius:0 7px 7px 0; padding:11px 13px; font-size:12.5px;
        line-height:1.75; color:#F0D6D2; }
  .err b{ color:var(--bad); }
  .err code{ font-family:"Archivo",monospace; background:rgba(0,0,0,.25);
             padding:1px 5px; border-radius:3px; }
</style>
</head>
<body>
<div class="wrap">

  <a class="mp-back" href="index.html">← 全部模組</a>

  <header>
    <h1>掉落練習 · 吉他</h1>
    <button class="run" id="run" type="button">開始</button>
  </header>

  <div class="picker">
    <label for="ex">練習</label>
    <select id="ex"></select>
  </div>
  <p class="meta" id="meta"></p>

  <canvas id="cv" width="612" height="400"></canvas>

  <div class="fb" id="fb"></div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>速度</label>
        <button class="step" id="bd" type="button" aria-label="降速">−</button>
        <div class="bv" id="bv">50</div>
        <button class="step" id="bu" type="button" aria-label="加速">+</button>
      </div>
      <div class="field">
        <label>看前面</label>
        <div class="seg" id="lead">
          <button type="button" data-v="4" aria-pressed="true">4 拍</button>
          <button type="button" data-v="8" aria-pressed="false">8 拍</button>
        </div>
      </div>
      <div class="field">
        <label>示範音</label>
        <div class="seg" id="demo">
          <button type="button" data-v="off" aria-pressed="false">關</button>
          <button type="button" data-v="on"  aria-pressed="true">開</button>
        </div>
      </div>
      <div class="field">
        <label>聽我彈</label>
        <div class="seg" id="micseg">
          <button type="button" data-v="off" aria-pressed="true">關</button>
          <button type="button" data-v="on"  aria-pressed="false">開</button>
        </div>
      </div>
    </div>
    <div id="gate"></div>
  </div>

</div>

<script src="shared/chords.js"></script>
<script src="shared/theory.js"></script>
<script src="shared/store.js"></script>
<script src="shared/pitch.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/clock.js"></script>
<script src="shared/timing.js"></script>
<script>
(function(){
  "use strict";

  if(!window.MP||!MP.chords||!MP.theory||!MP.store||!MP.pitch||!MP.audio||!MP.clock||!MP.timing){
    document.body.innerHTML='<p style="max-width:640px;margin:48px auto;padding:0 16px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.9;color:#F2EFE6">共用檔案載入失敗（需要 shared/chords.js、shared/pitch.js、shared/audio.js、shared/clock.js、shared/timing.js）。請確認這個 HTML 與 shared/ 資料夾放在同一層。</p>';
    return;
  }
  var $=function(id){ return document.getElementById(id); };
  var OPEN=MP.chords.GUITAR_TUNING;             // 第6弦 → 第1弦
  var NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  /* 指型取自 shared/chords.js —— 跟 fingering、chord-trainer 同一份 */
  var SHAPE={};
  ["Em","Am","A","D","E","C","G"].forEach(function(n){
    SHAPE[n]=MP.chords.GUITAR_SHAPES[n].frets;
  });

  // e(起始拍, 長度, [六弦格數或 null], 標籤, 刷弦方向)
  function chord(b,d,name,dir){
    return { b:b, d:d, frets:SHAPE[name].slice(), label:name, dir:dir||null, poly:true };
  }
  function pluck(b,d,str,fret,label){
    var f=[null,null,null,null,null,null]; f[str]=fret;
    return { b:b, d:d, frets:f, label:label||null, poly:false };
  }

  var EX={
    emam:{ name:"Em ↔ Am 交替", note:"對應進度第 4 關。看橘色的塊——那是不用動的手指位置。", len:8,
      e:[ chord(0,3.6,"Em"), chord(4,3.6,"Am") ] },

    ade:{ name:"A – D – E 循環", note:"對應進度第 6 關。D 只彈四條弦,注意左邊兩條沒有塊。", len:12,
      e:[ chord(0,3.6,"A"), chord(4,3.6,"D"), chord(8,3.6,"E") ] },

    gcd:{ name:"G – C – D", note:"這三個和弦能伴很多歌。G 的手要張得比較開。", len:12,
      e:[ chord(0,3.6,"G"), chord(4,3.6,"C"), chord(8,3.6,"D") ] },

    arpEm:{ name:"分解和弦 · Em → Am（單音）", len:8,
      note:"一拍撥一條弦。開麥克風時,這個模式會判斷你每一條弦彈得對不對。",
      e:[ pluck(0,0.9,0,0,"Em"), pluck(1,0.9,2,2), pluck(2,0.9,3,0), pluck(3,0.9,4,0),
          pluck(4,0.9,1,0,"Am"), pluck(5,0.9,2,2), pluck(6,0.9,3,2), pluck(7,0.9,4,1) ] },

    down:{ name:"四拍下刷 · Em", note:"對應進度第 7 關。每拍一下,先求穩不求快。", len:8,
      e:[ chord(0,0.8,"Em","D"), chord(1,0.8,"Em","D"), chord(2,0.8,"Em","D"), chord(3,0.8,"Em","D"),
          chord(4,0.8,"Am","D"), chord(5,0.8,"Am","D"), chord(6,0.8,"Am","D"), chord(7,0.8,"Am","D") ] },

    ddu:{ name:"下 下上 上下上（進階）", len:8,
      note:"最常用的刷弦型。↓ 手往下,↑ 手往上。這個先不急,把和弦按乾淨再說。",
      e:[ chord(0,0.4,"Em","D"), chord(1,0.4,"Em","D"), chord(1.5,0.4,"Em","U"),
          chord(2.5,0.4,"Em","U"), chord(3,0.4,"Em","D"), chord(3.5,0.4,"Em","U"),
          chord(4,0.4,"Am","D"), chord(5,0.4,"Am","D"), chord(5.5,0.4,"Am","U"),
          chord(6.5,0.4,"Am","U"), chord(7,0.4,"Am","D"), chord(7.5,0.4,"Am","U") ] }
  };

  /* 自建曲目（songs.html 存的）轉成掉落練習：一小節一個和弦。
     只收得了有指型的和弦——沒有指型就畫不出格數，硬畫會是錯的。 */
  function songToExercise(rec){
    var names = rec.mode === "degree"
      ? rec.bars.map(function(t){ var r=MP.theory.degreeToChord(t, rec.key); return r.ok ? r.text : t; })
      : rec.bars.slice();
    var shapes=MP.chords.GUITAR_SHAPES;
    var missing=[], events=[];
    names.forEach(function(n,i){
      var sh=shapes[n];
      if(!sh){ if(missing.indexOf(n)<0) missing.push(n); return; }
      events.push({ b:i*rec.beats, d:rec.beats*0.9, frets:sh.frets.slice(),
                    label:n, dir:null, poly:true });
    });
    if(!events.length) return null;
    return { name:rec.title, len:names.length*rec.beats, e:events, mine:true,
             note:"我的曲目 · " + rec.beats + "/4 · " + names.length + " 小節" +
                  (missing.length ? "　⚠ 沒有指型、已略過：" + missing.join(" ") : "") };
  }

  var MINE={};
  function loadMine(){
    return MP.store.get(MP.store.KEYS.songs).then(function(list){
      if(!list) return;
      list.forEach(function(rec){
        var ex=songToExercise(rec);
        if(ex) MINE["mine:"+rec.id]=ex;
      });
    }).catch(function(){});
  }
  function allEx(){ var o={}; Object.keys(EX).forEach(function(k){o[k]=EX[k];});
                    Object.keys(MINE).forEach(function(k){o[k]=MINE[k];}); return o; }

  var S={ ex:"emam", bpm:50, lead:4, demo:"on", mic:"off", running:false };
  function X(){ return EX[S.ex] || MINE[S.ex]; }

  /* ---------- 音訊 ---------- */
  var ctx=null,out=null;
  function A(){
    if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();
      out=ctx.createGain(); out.gain.value=0.5; out.connect(ctx.destination); }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  var mtof=MP.pitch.mtof, ftom=MP.pitch.ftom;

  /* 吉他改用真正的 Karplus–Strong 弦模擬（shared/audio.js）。
     和弦一起刷時每條弦要壓小聲一點，不然六條疊起來會爆。 */
  var PLUCK_GAIN={ poly:0.17, single:0.28 };
  function gpluck(freq,t,dur,poly){
    MP.audio.playNote("guitar",ctx,out,freq,t,dur,
      { gain: poly ? PLUCK_GAIN.poly : PLUCK_GAIN.single });
  }
  function click(t,down){
    MP.audio.click(ctx,out,t,down,
      { gainDown:0.2, gainUp:0.1, freqDown:1500, freqUp:900, decay:0.04 });
  }
  function playEv(e,t){
    var order=[0,1,2,3,4,5];
    if(e.dir==="U") order=order.slice().reverse();
    var k=0;
    order.forEach(function(s){
      if(e.frets[s]===null) return;
      gpluck(mtof(OPEN[s]+e.frets[s]), t+k*(e.poly?0.022:0), 1.3, e.poly);
      k++;
    });
  }

  /* ---------- 麥克風 ---------- */
  var mic=null,an=null,mbuf=null;
  /* 音頭偵測與時間差統計在 shared/timing.js */
  var onset=MP.timing.createOnsetDetector({minRms:0.02,rise:1.7,guard:0.1});
  /* file:// 在 Chrome 裡 isSecureContext 是 true 但仍拿不到麥克風，
     shared/pitch.js 有把這個特例處理掉 */
  var insecure=MP.pitch.isInsecure;
  function micOn(){
    if(insecure()){
      $("gate").innerHTML='<div class="err"><b>這個環境拿不到麥克風。</b>'+
        '瀏覽器只允許 <code>https://</code> 或 <code>localhost</code>。'+
        '掉落塊與示範音不受影響,可以正常練。</div>';
      setSeg("micseg","off"); S.mic="off"; return;
    }
    A();
    MP.pitch.requestMic({ctx:ctx}).then(function(h){
      mic=h; an=h.analyser; mbuf=h.buf;
      $("gate").innerHTML="";
    }).catch(function(){
      $("gate").innerHTML='<div class="err"><b>麥克風被拒絕。</b>在權限設定裡允許後重試。</div>';
      setSeg("micseg","off"); S.mic="off";
    });
  }
  function micOff(){
    MP.pitch.releaseMic(mic);   // ctx 共用，releaseMic 不會關掉它
    mic=null; an=null; mbuf=null; $("gate").innerHTML="";
  }
  /* 自相關音高偵測在 shared/pitch.js */
  function detect(buf,sr){ return MP.pitch.detect(buf,sr,{minRms:0.012}); }

  /* ---------- 幾何 ---------- */
  var cv=$("cv"), g=cv.getContext("2d");
  var W=cv.width, H=cv.height, FOOT=76, HIT=H-FOOT;
  var PAD=26, LW=(W-PAD*2)/5;                 // 六條弦道
  function laneX(s){ return PAD+LW*s; }

  function spb(){ return 60/S.bpm; }
  function leadSec(){ return S.lead*spb(); }
  function pps(){ return HIT/leadSec(); }

  var startT=0, lastMsg="";
  var offsets=MP.timing.createOffsets({limit:16,okAvg:30,offAvg:70,okSd:35,offSd:70});

  /* 圓角矩形跟樂器無關，放在 shared/clock.js。
     鍵盤幾何與六弦道各自留在自己檔案裡，那才是「畫成什麼樣」。 */
  function rr(x,y,w,h,r){ MP.clock.roundRect(g,x,y,w,h,r); }

  function draw(now){
    g.clearRect(0,0,W,H);
    var x=X(), sp=spb(), P=pps();
    var t = S.running ? (now-startT) : -leadSec();
    var loopSec = x.len*sp;

    // 弦道
    for(var s=0;s<6;s++){
      g.strokeStyle="#22302C"; g.lineWidth=3.4-s*0.42;
      g.beginPath(); g.moveTo(laneX(s),0); g.lineTo(laneX(s),HIT); g.stroke();
    }
    // 拍線
    g.strokeStyle="#1E2A27"; g.lineWidth=1;
    for(var k=0;k<=S.lead+1;k++){
      var bt=Math.ceil(t/sp)*sp+k*sp;
      var y=HIT-(bt-t)*P;
      if(y<0||y>HIT) continue;
      g.beginPath(); g.moveTo(0,y+.5); g.lineTo(W,y+.5); g.stroke();
    }

    var BW=Math.min(LW*0.72, 34);
    for(var rep=0;rep<2;rep++){
      x.e.forEach(function(e){
        var et=e.b*sp+rep*loopSec;
        var top=HIT-(et+e.d*sp-t)*P, bot=HIT-(et-t)*P;
        if(bot<-24||top>HIT+24) return;
        var live = bot>HIT-4 && top<HIT;

        e.frets.forEach(function(fr,s){
          if(fr===null) return;
          var cx=laneX(s), y0=Math.max(top,-24), y1=Math.min(bot,HIT);
          g.fillStyle = fr===0 ? (live?"#F2EFE6":"#C9C4B6") : (live?"#E9A63C":"#B9832C");
          rr(cx-BW/2, y0, BW, Math.max(4,y1-y0), 5);
          if(y1-y0>18){
            g.fillStyle="#1A1206"; g.font="700 13px Archivo, sans-serif";
            g.textAlign="center"; g.textBaseline="middle";
            g.fillText(fr, cx, y1-11);
          }
        });

        if(e.label && bot>0 && bot<HIT+30){
          g.fillStyle= live?"#F2EFE6":"#7E8C87";
          g.font="700 12px 'Noto Sans TC', sans-serif";
          g.textAlign="left"; g.textBaseline="alphabetic";
          g.fillText(e.label, 4, Math.min(bot-5, HIT-5));
        }
        if(e.dir && bot>0 && bot<HIT+20){
          g.fillStyle= live?"#E9A63C":"#5A6864";
          g.font="700 15px Archivo, sans-serif"; g.textAlign="right";
          g.fillText(e.dir==="D"?"↓":"↑", W-5, Math.min(bot-5, HIT-5));
        }
      });
    }

    // 判定線
    g.strokeStyle="#E9A63C"; g.lineWidth=2;
    g.beginPath(); g.moveTo(0,HIT); g.lineTo(W,HIT); g.stroke();

    // 弦名腳座
    var SN=["E","A","D","G","B","e"];
    g.fillStyle="#1A2523"; g.fillRect(0,HIT+2,W,FOOT-2);
    for(var s2=0;s2<6;s2++){
      g.strokeStyle="#2E3E3A"; g.lineWidth=3.4-s2*0.42;
      g.beginPath(); g.moveTo(laneX(s2),HIT+4); g.lineTo(laneX(s2),HIT+40); g.stroke();
      g.fillStyle="#7E8C87"; g.font="700 12px Archivo, sans-serif";
      g.textAlign="center"; g.textBaseline="alphabetic";
      g.fillText(SN[s2], laneX(s2), HIT+58);
      g.fillStyle="#4E5C58"; g.font="500 9px 'Noto Sans TC', sans-serif";
      g.fillText("第"+(6-s2)+"弦", laneX(s2), HIT+70);
    }

    if(S.running) raf=requestAnimationFrame(loop);
  }

  /* ---------- 引擎 ---------- */
  var raf=null,beatClock=null;

  /* 排程器在 shared/clock.js。示範音仍照事件時間各自排，
     因為刷弦事件不一定落在整拍上（下下上上下上）。 */
  function onBeat(index, t0){
    if(t0>ctx.currentTime) click(t0, index%4===0);
    if(S.demo!=="on") return;
    var x=X(), sp=spb(), loopSec=x.len*sp;
    x.e.forEach(function(e){
      for(var rep=0;rep<3;rep++){
        var et=startT+e.b*sp+rep*loopSec;
        if(et>ctx.currentTime && et<ctx.currentTime+0.4 && !e._p_[rep]){
          e._p_[rep]=true; playEv(e,et);
        }
      }
    });
  }

  function listen(){
    if(!an) return;
    an.getFloatTimeDomainData(mbuf);
    var d=detect(mbuf,ctx.sampleRate), now=ctx.currentTime;
    if(onset.feed(d.rms, now)){
      var x=X(), sp=spb(), loopSec=x.len*sp;
      var lt=(((now-startT)%loopSec)+loopSec)%loopSec;
      var evTimes=x.e.map(function(e){ return e.b*sp; });
      var best=MP.timing.nearestOffset(lt, evTimes, loopSec);
      var bestEv=null, bd=Infinity;
      x.e.forEach(function(e,i){
        var dt=Math.abs(lt-evTimes[i]);
        dt=Math.min(dt, loopSec-dt);
        if(dt<bd){ bd=dt; bestEv=e; }
      });
      if(best!==null) offsets.push(best*1000);

      lastMsg="";
      if(bestEv && !bestEv.poly && d.freq){
        var si=bestEv.frets.findIndex(function(f){ return f!==null; });
        var want=OPEN[si]+bestEv.frets[si];
        var got=Math.round(ftom(d.freq));
        if(got===want) lastMsg="第"+(6-si)+"弦 對";
        else lastMsg="第"+(6-si)+"弦 應該是 "+NAMES[want%12]+
             ",聽到 "+NAMES[((got%12)+12)%12];
      }
      paintFb();
    }
  }

  function paintFb(){
    var f=$("fb");
    if(S.mic!=="on"){
      f.innerHTML='<p class="fbnote" style="margin:0;padding:0;border:0">'+
        '打開「聽我彈」可以看到你刷早了還是晚了。需要 HTTPS 環境。<br>'+
        '沒有麥克風也能練——掉落塊本身的價值是<b>提前看到手要移到哪裡</b>。</p>';
      return;
    }
    var st=offsets.stats();
    if(!st){
      f.innerHTML=MP.timing.idleHtml("開始彈,這裡會顯示時間差。");
      return;
    }
    var extra = lastMsg
      ? MP.timing.row("音準", lastMsg, lastMsg.indexOf("對")>0?"ok":"bad", "font-size:13px")
      : "";
    /* 建議文案是吉他自己的：慢了通常是「換和弦來不及」 */
    var advice = st.onTime ? "時間差很小,這樣就對了。"
      : st.late ? "你平均慢了。多半是換和弦來不及——降速,先求乾淨。"
                : "你平均快了。刷弦搶在拍子前面,跟著節拍等一下。";
    advice += X().e[0].poly
      ? '<br>整個和弦一起刷時<b>只判斷時機</b>,不判斷哪條弦悶掉。要驗乾不乾淨用逐弦檢查,或練分解和弦。'
      : '<br>單音模式,每一條弦都會判斷音準。';
    f.innerHTML=MP.timing.rowsHtml(st, extra, advice);
  }

  /* ---------- 控制 ---------- */
  function loop(){
    if(!S.running) return;
    draw(ctx.currentTime);
    if(S.mic==="on") listen();
  }
  function resetPlayed(){ X().e.forEach(function(e){ e._p_=[false,false,false]; }); }
  function start(){
    A(); S.running=true;
    $("run").textContent="停止"; $("run").classList.add("on");
    startT=ctx.currentTime+leadSec();
    offsets.reset(); onset.reset(); lastMsg=""; resetPlayed();
    if(!beatClock) beatClock=MP.clock.createBeatClock(ctx,{ahead:0.3,intervalMs:40});
    beatClock.start(startT, spb, onBeat);
    raf=requestAnimationFrame(loop);
    paintFb();
  }
  function stop(){
    S.running=false;
    $("run").textContent="開始"; $("run").classList.remove("on");
    if(beatClock) beatClock.stop();
    cancelAnimationFrame(raf); draw(0);
  }
  function restart(){ if(S.running){ stop(); start(); } else draw(0); }

  $("run").addEventListener("click",function(){ S.running?stop():start(); });
  document.addEventListener("keydown",function(e){
    if(e.code==="Space"&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="SELECT"){
      e.preventDefault(); S.running?stop():start();
    }
  });

  function setSeg(id,v){
    Array.prototype.forEach.call($(id).children,function(x){
      x.setAttribute("aria-pressed", x.dataset.v===v?"true":"false");
    });
  }
  function seg(id,fn){
    $(id).addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      setSeg(id,b.dataset.v); fn(b.dataset.v);
    });
  }
  seg("lead",function(v){ S.lead=parseInt(v,10); restart(); });
  seg("demo",function(v){ S.demo=v; });
  seg("micseg",function(v){ S.mic=v; v==="on"?micOn():micOff(); paintFb(); });

  $("bu").addEventListener("click",function(){ S.bpm=Math.min(120,S.bpm+2); $("bv").textContent=S.bpm; restart(); });
  $("bd").addEventListener("click",function(){ S.bpm=Math.max(30,S.bpm-2); $("bv").textContent=S.bpm; restart(); });

  var sel=$("ex");

  function buildExList(){
    sel.innerHTML="";
    var all=allEx();
    Object.keys(all).forEach(function(k){
      all[k].e.forEach(function(e){ e._p_=[false,false,false]; });
    });
    var g1=document.createElement("optgroup"); g1.label="內建練習";
    Object.keys(EX).forEach(function(k){
      var o=document.createElement("option"); o.value=k; o.textContent=EX[k].name;
      g1.appendChild(o);
    });
    sel.appendChild(g1);
    var mine=Object.keys(MINE);
    if(mine.length){
      var g2=document.createElement("optgroup"); g2.label="我的曲目";
      mine.forEach(function(k){
        var o=document.createElement("option"); o.value=k; o.textContent=MINE[k].name;
        g2.appendChild(o);
      });
      sel.appendChild(g2);
    }
    sel.value=S.ex;
  }
  buildExList();
  sel.addEventListener("change",function(){ S.ex=sel.value; paintMeta(); paintFb(); restart(); });

  function paintMeta(){ $("meta").textContent=X().len+" 拍循環　·　"+X().note; }

  paintMeta(); paintFb(); draw(0);

  loadMine().then(function(){ buildExList(); });
  if(insecure()){
    $("gate").innerHTML='<div class="err">目前是 <code>file://</code> 環境,'+
      '「聽我彈」不能用。掉落塊與示範音正常。</div>';
  }

  /* 這個模組不分樂器，但要把 index.html 的選擇原樣帶回去，返回後才不會被重設 */
  (function(){
    var back=document.querySelector(".mp-back");
    if(back) back.href="index.html"+location.search;
  })();

})();
</script>
<script src="shared/sw-register.js"></script>
</body>
</html>
