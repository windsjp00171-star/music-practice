<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掉落練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121A18">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/tokens.css">
<script>
/* tokens.css 載入失敗時的 inline fallback。值要與 shared/tokens.css 一致。 */
(function(){
  if(getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()) return;
  var s=document.createElement("style");
  s.textContent=":root{--ink:#121A18;--ink-2:#1A2523;--ink-3:#243230;--line:#2E3E3A;"+
    "--paper:#F2EFE6;--dim:#7E8C87;--amber:#E9A63C;--good:#5FBF8F;--bad:#D8695E;--radius:10px}"+
    ".mp-back{display:inline-block;margin:14px 0 0;font-size:12px;color:#7E8C87;text-decoration:none}";
  document.head.appendChild(s);
})();
</script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--ink); color:var(--paper);
    font-family:"Noto Sans TC", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:40px;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:0 14px; }

  header{ padding:16px 0 12px; border-bottom:1px solid var(--line);
          display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1{ font-size:15px; font-weight:700; letter-spacing:.08em; }
  .run{ background:var(--paper); color:var(--ink); border:none; border-radius:9px;
        padding:10px 22px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .run.on{ background:var(--amber); color:#241703; }
  .run:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

  .picker{ display:flex; align-items:center; gap:10px; margin:14px 0 6px; flex-wrap:wrap; }
  .picker label{ font-size:11.5px; color:var(--dim); letter-spacing:.08em; }
  select{ background:var(--ink-3); color:var(--paper); border:1px solid var(--line);
          border-radius:8px; padding:8px 11px; font-family:inherit; font-size:13.5px; cursor:pointer; }
  select:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .meta{ font-size:11.5px; color:var(--dim); line-height:1.7; margin-bottom:10px; }

  canvas{ display:block; width:100%; border:1px solid var(--line);
          border-radius:12px; background:var(--ink-2); }

  .fb{ background:var(--ink-2); border:1px solid var(--line); border-radius:12px;
       padding:14px 15px; margin-top:12px; }
  .fbrow{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .fbrow:last-of-type{ margin-bottom:0; }
  .fblab{ font-size:12px; color:var(--dim); }
  .fbval{ font-family:"Archivo",sans-serif; font-weight:800; font-size:17px;
          font-variant-numeric:tabular-nums; }
  .fbval.ok{ color:var(--good); } .fbval.off{ color:var(--amber); } .fbval.bad{ color:var(--bad); }
  .fbnote{ font-size:12px; color:var(--dim); line-height:1.7; margin-top:10px;
           padding-top:10px; border-top:1px solid var(--line); }

  .panel{ border-top:1px solid var(--line); margin-top:16px; padding-top:14px;
          display:flex; flex-direction:column; gap:13px; }
  .row{ display:flex; flex-wrap:wrap; align-items:center; gap:11px 20px; }
  .field{ display:flex; align-items:center; gap:9px; }
  .field > label{ font-size:11.5px; color:var(--dim); letter-spacing:.08em; }
  .step{ width:40px; height:40px; border-radius:8px; background:var(--ink-3);
         color:var(--paper); border:1px solid var(--line); cursor:pointer; font-size:16px; }
  .step:hover{ background:var(--line); }
  .bv{ font-family:"Archivo",sans-serif; font-weight:700; font-size:22px;
       min-width:56px; text-align:center; font-variant-numeric:tabular-nums; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button{ background:transparent; color:var(--dim); border:none;
               border-right:1px solid var(--line); padding:8px 12px; font-size:12.5px;
               cursor:pointer; font-family:inherit; }
  .seg button:last-child{ border-right:none; }
  .seg button[aria-pressed="true"]{ background:var(--paper); color:var(--ink); font-weight:700; }
  .seg button:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }

  .err{ background:rgba(216,105,94,.1); border-left:2px solid var(--bad);
        border-radius:0 7px 7px 0; padding:11px 13px; font-size:12.5px;
        line-height:1.75; color:#F0D6D2; }
  .err b{ color:var(--bad); }
  .err code{ font-family:"Archivo",monospace; background:rgba(0,0,0,.25);
             padding:1px 5px; border-radius:3px; }
</style>
</head>
<body>
<div class="wrap">

  <a class="mp-back" href="index.html">← 全部模組</a>

  <header>
    <h1>掉落練習</h1>
    <button class="run" id="run" type="button">開始</button>
  </header>

  <div class="picker">
    <label for="ex">練習</label>
    <select id="ex"></select>
  </div>
  <p class="meta" id="meta"></p>

  <canvas id="cv" width="612" height="392"></canvas>

  <div class="fb" id="fb"></div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>速度</label>
        <button class="step" id="bd" type="button" aria-label="降速">−</button>
        <div class="bv" id="bv">50</div>
        <button class="step" id="bu" type="button" aria-label="加速">+</button>
      </div>
      <div class="field">
        <label>看前面</label>
        <div class="seg" id="lead">
          <button type="button" data-v="4" aria-pressed="true">4 拍</button>
          <button type="button" data-v="8" aria-pressed="false">8 拍</button>
        </div>
      </div>
      <div class="field">
        <label>示範音</label>
        <div class="seg" id="demo">
          <button type="button" data-v="off" aria-pressed="false">關</button>
          <button type="button" data-v="on"  aria-pressed="true">開</button>
        </div>
      </div>
      <div class="field">
        <label>聽我彈</label>
        <div class="seg" id="micseg">
          <button type="button" data-v="off" aria-pressed="true">關</button>
          <button type="button" data-v="on"  aria-pressed="false">開</button>
        </div>
      </div>
    </div>
    <div id="gate"></div>
  </div>

</div>

<script src="shared/theory.js"></script>
<script src="shared/store.js"></script>
<script src="shared/pitch.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/clock.js"></script>
<script src="shared/timing.js"></script>
<script>
(function(){
  "use strict";

  if(!window.MP||!MP.theory||!MP.store||!MP.pitch||!MP.audio||!MP.clock||!MP.timing){
    document.body.innerHTML='<p style="max-width:640px;margin:48px auto;padding:0 16px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.9;color:#F2EFE6">共用檔案載入失敗（需要 shared/pitch.js、shared/audio.js、shared/clock.js、shared/timing.js）。請確認這個 HTML 與 shared/ 資料夾放在同一層。</p>';
    return;
  }
  var $=function(id){ return document.getElementById(id); };
  var LO=48, HI=71;                       // C3 → B4
  var NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var WHITE_PC=[0,2,4,5,7,9,11];
  var BLACK_PREV={1:0, 3:1, 6:3, 8:4, 10:5};

  /* ---------- 練習內容 ---------- */
  // b = 起始拍, d = 長度(拍), n = MIDI, f = 右手指法
  function ev(b,d,notes,fingers,label){
    return { b:b, d:d, n:notes, f:fingers, label:label };
  }
  var EX={
    six:{ name:"C 大調六個和弦", bars:4, note:"對應進度第 3 關。三個音一起下去,右手 1-3-5。",
      poly:true, len:24,
      e:[ ev(0,3.6,[48,52,55],[1,3,5],"C"),  ev(4,3.6,[50,53,57],[1,3,5],"Dm"),
          ev(8,3.6,[52,55,59],[1,3,5],"Em"), ev(12,3.6,[53,57,60],[1,3,5],"F"),
          ev(16,3.6,[55,59,62],[1,3,5],"G"), ev(20,3.6,[57,60,64],[1,3,5],"Am") ] },

    p145:{ name:"進行 1–4–5", bars:4, note:"最基本的三個和弦。慢慢來,先求按對。",
      poly:true, len:16,
      e:[ ev(0,3.6,[48,52,55],[1,3,5],"C"), ev(4,3.6,[53,57,60],[1,3,5],"F"),
          ev(8,3.6,[55,59,62],[1,3,5],"G"), ev(12,3.6,[48,52,55],[1,3,5],"C") ] },

    inv:{ name:"C 的三種轉位", bars:4, note:"對應進度第 5 關。注意最低音換了,但都是 C E G 三個音。",
      poly:true, len:12,
      e:[ ev(0,3.6,[48,52,55],[1,3,5],"原位"),
          ev(4,3.6,[52,55,60],[1,2,5],"第一轉位"),
          ev(8,3.6,[55,60,64],[1,3,5],"第二轉位") ] },

    smooth:{ name:"順階連接（轉位應用）", bars:4,
      note:"對應進度第 6 關。看手指移動多小——這就是轉位的用處。",
      poly:true, len:16,
      e:[ ev(0,3.6,[48,52,55],[1,3,5],"C"),  ev(4,3.6,[48,53,57],[1,3,5],"F/C"),
          ev(8,3.6,[50,55,59],[1,3,5],"G/D"), ev(12,3.6,[48,52,55],[1,3,5],"C") ] },

    scale:{ name:"C 大調音階（單音）", bars:2,
      note:"單音練習。開麥克風時,這個模式會判斷你彈的音對不對。",
      poly:false, len:8,
      e:[ ev(0,0.9,[48],[1]), ev(1,0.9,[50],[2]), ev(2,0.9,[52],[3]),
          ev(3,0.9,[53],[1]), ev(4,0.9,[55],[2]), ev(5,0.9,[57],[3]),
          ev(6,0.9,[59],[4]), ev(7,0.9,[60],[5]) ] }
  };

  /* 自建曲目轉成掉落練習：一小節一個三和弦。
     和弦的音要排進鍵盤畫得出來的範圍（LO..HI），
     超出去的音在畫面上根本不存在，會變成「聽得到卻看不到」。 */
  function voiceInRange(pcs){
    var out=[], prev=LO-1;
    pcs.forEach(function(pc){
      var m=LO + (((pc - LO) % 12) + 12) % 12;      // 範圍內最低的同名音
      while(m <= prev) m += 12;                      // 疊在前一個音之上
      while(m > HI) m -= 12;                         // 超出上限就折回來
      out.push(m); prev=m;
    });
    return out;
  }

  function songToExercise(rec){
    var names = rec.mode === "degree"
      ? rec.bars.map(function(t){ var r=MP.theory.degreeToChord(t, rec.key); return r.ok ? r.text : t; })
      : rec.bars.slice();
    var missing=[], events=[];
    names.forEach(function(n,i){
      var p=MP.theory.parseChordToken(n);
      if(!p){ if(missing.indexOf(n)<0) missing.push(n); return; }
      var pcs=p.notes.map(function(x){ return ((x%12)+12)%12; }).slice(0,4);
      var notes=voiceInRange(pcs);
      var fingers=notes.length>3 ? [1,2,3,5] : [1,3,5];
      events.push({ b:i*rec.beats, d:rec.beats*0.9, n:notes, f:fingers, label:n });
    });
    if(!events.length) return null;
    return { name:rec.title, len:names.length*rec.beats, e:events, poly:true, mine:true,
             note:"我的曲目 · " + rec.beats + "/4 · " + names.length + " 小節" +
                  (missing.length ? "　⚠ 認不得、已略過：" + missing.join(" ") : "") };
  }

  var MINE={};
  function loadMine(){
    return MP.store.get(MP.store.KEYS.songs).then(function(list){
      if(!list) return;
      list.forEach(function(rec){
        var ex=songToExercise(rec);
        if(ex) MINE["mine:"+rec.id]=ex;
      });
    }).catch(function(){});
  }

  var S={ ex:"p145", bpm:50, lead:4, demo:"on", mic:"off", running:false };
  function X(){ return EX[S.ex] || MINE[S.ex]; }

  /* ---------- 音訊 ---------- */
  var ctx=null,out=null;
  function A(){
    if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();
      out=ctx.createGain(); out.gain.value=0.5; out.connect(ctx.destination); }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  var mtof=MP.pitch.mtof, ftom=MP.pitch.ftom;

  /* 鋼琴音色改成取樣緩衝（shared/audio.js，參數移植自 PitchPal）。
     TONE_GAIN 讓三個音同時響的音量跟原本相當。 */
  var TONE_GAIN=0.16;
  function tone(f,t,dur){
    MP.audio.playNote("piano",ctx,out,f,t,dur,{gain:TONE_GAIN});
  }
  function click(t,down){
    MP.audio.click(ctx,out,t,down,
      { gainDown:0.2, gainUp:0.1, freqDown:1500, freqUp:900, decay:0.04 });
  }

  /* ---------- 麥克風 ---------- */
  var mic=null,an=null,mbuf=null;
  /* 音頭偵測與時間差統計在 shared/timing.js */
  var onset=MP.timing.createOnsetDetector({minRms:0.02,rise:1.7,guard:0.12});
  /* file:// 在 Chrome 裡 isSecureContext 是 true 但仍拿不到麥克風，
     shared/pitch.js 有把這個特例處理掉 */
  var insecure=MP.pitch.isInsecure;
  function micOn(){
    if(insecure()){
      $("gate").innerHTML='<div class="err"><b>這個環境拿不到麥克風。</b>'+
        '瀏覽器只允許 <code>https://</code> 或 <code>localhost</code>,'+
        '<code>file://</code> 不行。掉落塊與示範音不受影響,可以正常練。</div>';
      setSeg("micseg","off"); S.mic="off"; return;
    }
    A();
    MP.pitch.requestMic({ctx:ctx}).then(function(h){
      mic=h; an=h.analyser; mbuf=h.buf;
      $("gate").innerHTML="";
    }).catch(function(){
      $("gate").innerHTML='<div class="err"><b>麥克風被拒絕。</b>在權限設定裡允許後重試。</div>';
      setSeg("micseg","off"); S.mic="off";
    });
  }
  function micOff(){
    MP.pitch.releaseMic(mic);   // ctx 共用，releaseMic 不會關掉它
    mic=null; an=null; mbuf=null; $("gate").innerHTML="";
  }
  /* 自相關音高偵測在 shared/pitch.js */
  function detect(buf,sr){ return MP.pitch.detect(buf,sr,{minRms:0.012}); }

  /* ---------- 鍵盤幾何 ---------- */
  var cv=$("cv"), g=cv.getContext("2d");
  var W=cv.width, H=cv.height, KBH=104, HIT=H-KBH;
  var whites=[];
  for(var m=LO;m<=HI;m++) if(WHITE_PC.indexOf(m%12)>=0) whites.push(m);
  var WW=W/whites.length, BW=WW*0.62;

  function keyX(m){
    var pc=m%12;
    if(WHITE_PC.indexOf(pc)>=0) return { x:whites.indexOf(m)*WW, w:WW, black:false };
    var prevPc=WHITE_PC[BLACK_PREV[pc]];
    var prevM=m-(pc-prevPc);
    var i=whites.indexOf(prevM);
    return { x:i*WW+WW-BW/2, w:BW, black:true };
  }

  /* ---------- 繪製 ---------- */
  var startT=0, hitFlash={};
  var offsets=MP.timing.createOffsets({limit:16,okAvg:30,offAvg:70,okSd:35,offSd:70});

  function spb(){ return 60/S.bpm; }
  function leadSec(){ return S.lead*spb(); }
  function pps(){ return HIT/leadSec(); }

  function draw(now){
    g.clearRect(0,0,W,H);
    var x=X(), sp=spb(), P=pps();
    var t = S.running ? (now-startT) : -leadSec();
    var loopSec = x.len*sp;

    // 拍線
    g.strokeStyle="#1E2A27"; g.lineWidth=1;
    for(var k=0;k<=S.lead+1;k++){
      var bt=Math.ceil(t/sp)*sp+k*sp;
      var y=HIT-(bt-t)*P;
      if(y<0||y>HIT) continue;
      g.beginPath(); g.moveTo(0,y+.5); g.lineTo(W,y+.5); g.stroke();
    }

    // 掉落塊（含下一輪循環）
    for(var rep=0; rep<2; rep++){
      x.e.forEach(function(e){
        var et=e.b*sp+rep*loopSec;
        var top=HIT-(et+e.d*sp-t)*P, bot=HIT-(et-t)*P;
        if(bot<-20||top>HIT+20) return;
        e.n.forEach(function(m,i){
          if(m<LO||m>HI) return;
          var k=keyX(m);
          var y0=Math.max(top,-20), y1=Math.min(bot,HIT);
          g.fillStyle = k.black ? "#C8862A" : "#D9D4C6";
          if(bot>HIT-4 && top<HIT) g.fillStyle = k.black ? "var(--amber)" : "#F2EFE6";
          rr(k.x+1.5, y0, k.w-3, Math.max(3,y1-y0), 4);
          if(y1-y0>22){
            g.fillStyle="#1A1206"; g.font="700 11px Archivo, sans-serif";
            g.textAlign="center";
            g.fillText(e.f[i], k.x+k.w/2, y1-8);
          }
        });
        // 和弦名
        if(e.label && bot>0 && bot<HIT+30){
          var kk=keyX(e.n[0]);
          g.fillStyle="#7E8C87"; g.font="600 11px 'Noto Sans TC', sans-serif";
          g.textAlign="left";
          g.fillText(e.label, Math.min(kk.x, W-56), Math.min(bot-6, HIT-6));
        }
      });
    }

    // 判定線
    g.strokeStyle="#E9A63C"; g.lineWidth=2;
    g.beginPath(); g.moveTo(0,HIT); g.lineTo(W,HIT); g.stroke();

    drawKeyboard(t, sp, loopSec);
    if(S.running) raf=requestAnimationFrame(function(){ draw(ctx.currentTime-0); });
  }

  /* 圓角矩形跟樂器無關，放在 shared/clock.js。
     鍵盤幾何與六弦道各自留在自己檔案裡，那才是「畫成什麼樣」。 */
  function rr(x,y,w,h,r){ MP.clock.roundRect(g,x,y,w,h,r); }

  function drawKeyboard(t,sp,loopSec){
    var lit={};
    if(S.running){
      var lt=((t%loopSec)+loopSec)%loopSec;
      X().e.forEach(function(e){
        var et=e.b*sp;
        if(lt>=et-0.04 && lt<et+e.d*sp) e.n.forEach(function(m){ lit[m]=true; });
      });
    }
    whites.forEach(function(m,i){
      g.fillStyle = lit[m] ? "#E9A63C" : "#F2EFE6";
      g.fillRect(i*WW+1, HIT+3, WW-2, KBH-6);
      if(m%12===0){
        g.fillStyle="#8A8578"; g.font="600 10px Archivo, sans-serif"; g.textAlign="center";
        g.fillText("C"+(Math.floor(m/12)-1), i*WW+WW/2, HIT+KBH-12);
      }
    });
    for(var m=LO;m<=HI;m++){
      if(WHITE_PC.indexOf(m%12)>=0) continue;
      var k=keyX(m);
      g.fillStyle = lit[m] ? "#E9A63C" : "#121A18";
      g.fillRect(k.x, HIT+3, k.w, KBH*0.62);
    }
  }

  /* ---------- 引擎 ---------- */
  var raf=null, beatClock=null;

  /* 排程器在 shared/clock.js，這裡只管「這一拍要發生什麼」 */
  function onBeat(index, t0){
    if(t0<=ctx.currentTime) return;
    var x=X(), sp=spb();
    click(t0, index%4===0);
    if(S.demo==="on"){
      var lb=((index%x.len)+x.len)%x.len;
      x.e.forEach(function(e){
        if(e.b===lb) e.n.forEach(function(m,i){ tone(mtof(m),t0+i*0.01,e.d*sp); });
      });
    }
  }

  function listen(){
    if(!an) return;
    an.getFloatTimeDomainData(mbuf);
    var d=detect(mbuf,ctx.sampleRate), now=ctx.currentTime;
    if(onset.feed(d.rms, now)){
      var x=X(), sp=spb(), loopSec=x.len*sp;
      var lt=(((now-startT)%loopSec)+loopSec)%loopSec;
      var best=MP.timing.nearestOffset(lt, x.e.map(function(e){ return e.b*sp; }), loopSec);
      if(best!==null) offsets.push(best*1000);
      paintFb(d);
    }
  }

  function paintFb(d){
    var f=$("fb");
    if(S.mic!=="on"){
      f.innerHTML='<p class="fbnote" style="margin:0;padding:0;border:0">'+
        '打開「聽我彈」可以看到你按早了還是晚了。需要 HTTPS 環境。<br>'+
        '沒有麥克風也能練——掉落塊本身的價值是讓你<b>提前看到</b>接下來要按哪裡。</p>';
      return;
    }
    var st=offsets.stats();
    if(!st){
      f.innerHTML=MP.timing.idleHtml("開始彈,這裡會顯示時間差。");
      return;
    }
    var extra="";
    if(!X().poly && d && d.freq){
      extra=MP.timing.row("聽到的音", MP.pitch.nameOf(ftom(d.freq)));
    }
    /* 建議文案是鋼琴自己的：慢了通常是「找鍵找太久」 */
    var advice = st.onTime ? "時間差很小,這樣就對了。"
      : st.late ? "你平均慢了。多半是找鍵找太久——把速度降下來,讓手先記住位置。"
                : "你平均快了。不要搶在塊碰到線之前按。";
    if(X().poly) advice+='<br>三個音一起彈時只判斷時機,不判斷按對哪些鍵——那要用單音練習。';
    f.innerHTML=MP.timing.rowsHtml(st, extra, advice);
  }

  /* ---------- 控制 ---------- */
  function loop(){
    if(!S.running) return;
    raf=requestAnimationFrame(loop);
    draw(ctx.currentTime);
    if(S.mic==="on") listen();
  }
  function start(){
    A(); S.running=true;
    $("run").textContent="停止"; $("run").classList.add("on");
    startT=ctx.currentTime+leadSec(); offsets.reset(); onset.reset();
    if(!beatClock) beatClock=MP.clock.createBeatClock(ctx,{ahead:0.3,intervalMs:40});
    beatClock.start(startT, spb, onBeat);
    raf=requestAnimationFrame(loop);
    paintFb();
  }
  function stop(){
    S.running=false;
    $("run").textContent="開始"; $("run").classList.remove("on");
    if(beatClock) beatClock.stop();
    cancelAnimationFrame(raf);
    draw(0);
  }
  function restart(){ if(S.running){ stop(); start(); } else draw(0); }

  $("run").addEventListener("click",function(){ S.running?stop():start(); });
  document.addEventListener("keydown",function(e){
    if(e.code==="Space"&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="SELECT"){
      e.preventDefault(); S.running?stop():start();
    }
  });

  function setSeg(id,v){
    Array.prototype.forEach.call($(id).children,function(x){
      x.setAttribute("aria-pressed", x.dataset.v===v?"true":"false");
    });
  }
  function seg(id,fn){
    $(id).addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      setSeg(id,b.dataset.v); fn(b.dataset.v);
    });
  }
  seg("lead",function(v){ S.lead=parseInt(v,10); restart(); });
  seg("demo",function(v){ S.demo=v; });
  seg("micseg",function(v){ S.mic=v; v==="on"?micOn():micOff(); paintFb(); });

  $("bu").addEventListener("click",function(){ S.bpm=Math.min(120,S.bpm+2); $("bv").textContent=S.bpm; restart(); });
  $("bd").addEventListener("click",function(){ S.bpm=Math.max(30,S.bpm-2); $("bv").textContent=S.bpm; restart(); });

  var sel=$("ex");

  function buildExList(){
    sel.innerHTML="";
    var g1=document.createElement("optgroup"); g1.label="內建練習";
    Object.keys(EX).forEach(function(k){
      var o=document.createElement("option"); o.value=k; o.textContent=EX[k].name;
      g1.appendChild(o);
    });
    sel.appendChild(g1);
    var mine=Object.keys(MINE);
    if(mine.length){
      var g2=document.createElement("optgroup"); g2.label="我的曲目";
      mine.forEach(function(k){
        var o=document.createElement("option"); o.value=k; o.textContent=MINE[k].name;
        g2.appendChild(o);
      });
      sel.appendChild(g2);
    }
    sel.value=S.ex;
  }
  buildExList();
  sel.addEventListener("change",function(){ S.ex=sel.value; paintMeta(); paintFb(); restart(); });

  function paintMeta(){
    var x=X();
    $("meta").textContent=x.len+" 拍循環　·　"+x.note;
  }

  paintMeta(); paintFb(); draw(0);

  loadMine().then(function(){ buildExList(); });
  if(insecure()){
    $("gate").innerHTML='<div class="err">目前是 <code>file://</code> 環境,'+
      '「聽我彈」不能用。掉落塊與示範音正常。</div>';
  }

  /* 這個模組不分樂器，但要把 index.html 的選擇原樣帶回去，返回後才不會被重設 */
  (function(){
    var back=document.querySelector(".mp-back");
    if(back) back.href="index.html"+location.search;
  })();

})();
</script>
<script src="shared/sw-register.js"></script>
</body>
</html>
